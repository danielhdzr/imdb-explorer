<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMDb Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>IMDb Explorer</h1>
    <p class="subtitulo">Consulta sobre los datos públicos de IMDb — PostgreSQL + FastAPI</p>
  </header>

  <main>
    <form id="filtros">
      <div class="campo">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" placeholder="ej. Matrix">
      </div>

      <div class="campo">
        <label for="tipo">Tipo</label>
        <select id="tipo">
          <option value="">Todos</option>
        </select>
      </div>

      <div class="campo">
        <label for="genero">Género</label>
        <select id="genero">
          <option value="">Todos</option>
        </select>
      </div>

      <div class="campo">
        <label for="director">Director</label>
        <input type="text" id="director" placeholder="ej. Nolan">
      </div>

      <div class="campo">
        <label for="actor">Actor / Actriz</label>
        <input type="text" id="actor" placeholder="ej. Pacino">
      </div>

      <div class="campo">
        <label for="rating_min">Rating mínimo</label>
        <input type="number" id="rating_min" min="0" max="10" step="0.1">
      </div>

      <div class="campo">
        <label for="year_min">Año desde</label>
        <input type="number" id="year_min" placeholder="1990">
      </div>

      <div class="campo">
        <label for="year_max">Año hasta</label>
        <input type="number" id="year_max" placeholder="2026">
      </div>

      <button type="submit">Buscar</button>
    </form>

    <div id="estado"></div>

    <table id="resultados">
      <thead>
        <tr>
          <th>Título</th>
          <th>Año</th>
          <th>Tipo</th>
          <th>Género(s)</th>
          <th>Rating</th>
          <th>Director(es)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="paginacion"></div>
  </main>

  <div id="modal-fondo" class="oculto">
    <div id="modal">
      <button id="cerrar-modal">&times;</button>
      <div id="modal-contenido"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
